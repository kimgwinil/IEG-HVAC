function MultiSeriesChart({ series }) {
  if (!series.length) return (
    <div style={{ display: 'grid', placeItems: 'center', color: 'var(--ink-4)', fontSize: 12 }}>
      Select a signal above to display.
    </div>
  );
  const w = 1100, h = 320;
  const padL = 40, padR = 40, padT = 12, padB = 22;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  // each series has independent normalization
  const len = Math.max(...series.map(s => s.data.length));
  const xAt = (i) => padL + (i / Math.max(1, len - 1)) * plotW;

  // We'll show only the first series' Y axis (left) and second series' Y axis (right) if any
  const pri = series[0];
  const sec = series[1];

  const seriesPath = (arr, min, max) => {
    if (arr.length < 2) return '';
    const range = max - min || 1;
    const yAt = (v) => padT + plotH - ((v - min) / range) * plotH;
    let p = `M ${xAt(0)} ${yAt(arr[0])}`;
    for (let i = 1; i < arr.length; i++) {
      const xp = xAt(i - 1), yp = yAt(arr[i - 1]);
      const x = xAt(i), y = yAt(arr[i]);
      const cx = (xp + x) / 2;
      p += ` C ${cx} ${yp}, ${cx} ${y}, ${x} ${y}`;
    }
    return p;
  };
  const seriesArea = (arr, min, max) => {
    if (arr.length < 2) return '';
    const line = seriesPath(arr, min, max);
    return `${line} L ${xAt(arr.length - 1)} ${padT + plotH} L ${xAt(0)} ${padT + plotH} Z`;
  };

  const minMax = (arr) => {
    if (!arr.length) return [0, 1];
    let min = Math.min(...arr), max = Math.max(...arr);
    const pad = (max - min) * 0.15 + 0.5;
    return [min - pad, max + pad];
  };
  const [priMin, priMax] = minMax(pri.data);
  const [secMin, secMax] = sec ? minMax(sec.data) : [0, 1];

  // gridlines from primary
  const yTicks = 5;
  const tickVals = [];
  for (let i = 0; i <= yTicks; i++) tickVals.push(priMin + (priMax - priMin) * i / yTicks);

  // x labels — show minute marks
  const xLabels = [];
  const labelN = 6;
  for (let i = 0; i <= labelN; i++) {
    const idx = Math.round((i / labelN) * (len - 1));
    const minutesAgo = Math.round((len - 1 - idx));
    xLabels.push({ idx, label: minutesAgo === 0 ? 'now' : `−${minutesAgo}m` });
  }

  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: '100%' }}>
      {/* gridlines */}
      {tickVals.map((v, i) => {
        const y = padT + plotH - ((v - priMin) / (priMax - priMin)) * plotH;
        return (
          <g key={i}>
            <line x1={padL} x2={w - padR} y1={y} y2={y} stroke="#E7EBF0" />
            <text x={padL - 6} y={y + 4} textAnchor="end" fontSize="10" fontFamily="JetBrains Mono" fill={pri.color}>{v.toFixed(1)}</text>
          </g>
        );
      })}
      {sec && [secMin, (secMin + secMax) / 2, secMax].map((v, i) => {
        const y = padT + plotH - ((v - secMin) / (secMax - secMin)) * plotH;
        return (
          <text key={i} x={w - padR + 6} y={y + 4} textAnchor="start" fontSize="10" fontFamily="JetBrains Mono" fill={sec.color}>{v.toFixed(sec.key === 'co2' ? 0 : 1)}</text>
        );
      })}
      {/* x labels */}
      {xLabels.map((xl, i) => (
        <text key={i} x={xAt(xl.idx)} y={h - 8} textAnchor="middle" fontSize="10" fontFamily="JetBrains Mono" fill="#8A93A4">{xl.label}</text>
      ))}

      {/* area + line for primary */}
      <defs>
        <linearGradient id="g-pri" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={pri.color} stopOpacity="0.25" />
          <stop offset="100%" stopColor={pri.color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={seriesArea(pri.data, priMin, priMax)} fill="url(#g-pri)" />
      <path d={seriesPath(pri.data, priMin, priMax)} fill="none" stroke={pri.color} strokeWidth="2.2" />

      {/* secondary as overlay (normalized to its own scale, plotted on primary visual band) */}
      {series.slice(1).map((s, idx) => {
        const [mn, mx] = minMax(s.data);
        return (
          <path key={idx} d={seriesPath(s.data, mn, mx)} fill="none" stroke={s.color} strokeWidth="1.8" opacity="0.85" />
        );
      })}
    </svg>
  );
}

// ── OBSERVATION CHART (live multi-series) ────────────────────────────────
function ObservationChart({ s, outputs, lang }) {
  const w = 800, h = 200, padL = 48, padR = 48, padT = 14, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const N = 60;

  const minMax = arr => {
    if (!arr.length) return [0, 1];
    const mn = Math.min(...arr), mx = Math.max(...arr);
    const pad = (mx - mn) * 0.15 + 0.5;
    return [mn - pad, mx + pad];
  };

  const series = outputs.map((k, idx) => {
    const arr = (s.hist[k] || []).slice(-N);
    const [mn, mx] = minMax(arr);
    return { key: k, color: SIGNAL_META[k]?.color || '#888', data: arr, mn, mx, side: idx % 2 === 0 ? 'L' : 'R' };
  });

  const xAt = (i, n) => padL + (i / Math.max(1, n - 1)) * plotW;
  const yAt = (v, mn, mx) => padT + plotH - ((v - mn) / (mx - mn || 1)) * plotH;

  const pathFor = (arr, mn, mx) => {
    if (arr.length < 2) return '';
    const n = arr.length;
    let p = `M ${xAt(0, n)} ${yAt(arr[0], mn, mx)}`;
    for (let i = 1; i < n; i++) {
      const xp = xAt(i - 1, n), yp = yAt(arr[i - 1], mn, mx);
      const x  = xAt(i, n),    y  = yAt(arr[i], mn, mx);
      const cx = (xp + x) / 2;
      p += ` C ${cx} ${yp}, ${cx} ${y}, ${x} ${y}`;
    }
    return p;
  };

  const xTicks = [];
  for (let i = 0; i <= 5; i++) {
    const idx = Math.round((i / 5) * (N - 1));
    xTicks.push({ x: xAt(idx, N), label: idx === N - 1 ? (lang === 'ko' ? '현재' : 'now') : `−${N - 1 - idx}s` });
  }

  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: '100%' }}>
      <line x1={padL} x2={w - padR} y1={padT + plotH} y2={padT + plotH} stroke="#FAD0B8" />
      {xTicks.map((t, i) => (
        <g key={i}>
          <line x1={t.x} x2={t.x} y1={padT} y2={padT + plotH} stroke="rgba(217,119,87,.15)" />
          <text x={t.x} y={h - 8} textAnchor="middle" fontSize="10" fontFamily="JetBrains Mono" fill="#8A93A4">{t.label}</text>
        </g>
      ))}

      {series.map((sr, i) => {
        const meta = SIGNAL_META[sr.key];
        const x = sr.side === 'L' ? padL - 6 : w - padR + 6;
        const anchor = sr.side === 'L' ? 'end' : 'start';
        return (
          <g key={i}>
            {[sr.mn, (sr.mn + sr.mx) / 2, sr.mx].map((v, j) => (
              <text key={j} x={x} y={yAt(v, sr.mn, sr.mx) + 4}
                    textAnchor={anchor} fontSize="9" fontFamily="JetBrains Mono"
                    fill={sr.color} opacity="0.85">
                {meta?.fmt(v)}
              </text>
            ))}
          </g>
        );
      })}

      {series.map((sr, i) => (
        <g key={i}>
          <path d={pathFor(sr.data, sr.mn, sr.mx)} fill="none" stroke={sr.color} strokeWidth="2.5" strokeLinejoin="round" />
          {sr.data.length > 0 && (
            <circle cx={xAt(sr.data.length - 1, sr.data.length)} cy={yAt(sr.data[sr.data.length - 1], sr.mn, sr.mx)}
                    r="3.5" fill={sr.color} />
          )}
        </g>
      ))}

      {/* legend */}
      <g transform={`translate(${padL + 4}, ${padT + 3})`}>
        {series.map((sr, i) => {
          const meta = SIGNAL_META[sr.key];
          return (
            <g key={i} transform={`translate(${i * 130}, 0)`}>
              <rect x="0" y="0" width="10" height="10" rx="2" fill={sr.color} />
              <text x="14" y="9" fontSize="10" fontFamily="Pretendard" fill="#0F1A2E" fontWeight="600">
                {meta?.[lang] || sr.key}
              </text>
            </g>
          );
        })}
      </g>
    </svg>
  );
}

                {outputs.map(k => {
                  const meta = SIGNAL_META[k];
                  return (

}

Object.assign(window, { CurriculumScreen, LessonScreen, ComponentDetailOverlay, SIGNAL_META, INPUT_META });

  <script type="text/babel">
// Root App — bezel + sidebar + screens + curriculum + component detail overlay.
// Controls are integrated directly in the UI (no popup Tweaks panel).

const { useState, useEffect, useMemo, useRef } = React;

const DEFAULT_SETTINGS = { lang: 'en', unit: 'C' };

function useSettings() {
  const [s, setS] = useState(() => {
    try {
      const stored = JSON.parse(localStorage.getItem('hvac-settings') || '{}');
      return { ...DEFAULT_SETTINGS, ...stored };
    } catch { return DEFAULT_SETTINGS; }
  });
  const update = (patch) => {
    setS(prev => {
      const next = typeof patch === 'function' ? patch(prev) : { ...prev, ...patch };
      try { localStorage.setItem('hvac-settings', JSON.stringify(next)); } catch {}
      return next;
    });
  };
  return [s, update];
}

function App() {
  const [settings, setSettings] = useSettings();
  const [state, update] = useSimulation();

  // current view
  const [view, setView] = useState('dashboard');
  // when in curriculum: optionally drilled into a lesson
  const [lessonN, setLessonN] = useState(null);
  // component detail overlay (clicked from schematic)
  const [overlayComp, setOverlayComp] = useState(null);

  // Expose openLesson globally so the component overlay can call it
  useEffect(() => {
    window.__openLesson = (n) => {
      setView('curriculum');
      setLessonN(n);
    };
  }, []);

  // wall clock
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  const clockStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dateStr = now.toLocaleDateString(settings.lang === 'ko' ? 'ko-KR' : 'en-US',
    { year: 'numeric', month: 'short', day: '2-digit', weekday: 'short' });

  // Translator
  const L = (k) => window.t(k, settings.lang);

  // Set version on the simulation
  const setVersion = (v) => {
    const patch = { version: v };
    if (v === 'malaysia' && state.mode === 'heat') patch.mode = 'cool';
    update(patch);
  };

  // Nav definition
  const NAV = [
    { id: 'dashboard',  icon: 'dashboard', label: L('nav_dashboard') },
    { id: 'schematic',  icon: 'schematic', label: L('nav_schematic') },
    { id: 'mode',       icon: 'mode',      label: L('nav_mode') },
    { id: 'curriculum', icon: 'ai',        label: settings.lang === 'ko' ? '교육과정' : 'Course' },
    { id: 'ai',         icon: 'ai',        label: L('nav_ai') },
    { id: 'energy',     icon: 'energy',    label: L('nav_energy') },
    { id: 'trend',      icon: 'trend',     label: L('nav_trend') },
    { id: 'alarm',      icon: 'alarm',     label: L('nav_alarm') },
    { id: 'settings',   icon: 'settings',  label: L('nav_settings') },
  ];

  const renderScreen = () => {
    switch (view) {
      case 'dashboard':  return <DashboardScreen s={state} set={update} L={L} />;
      case 'schematic':  return <SchematicScreen s={state} set={update} L={L} lang={settings.lang} onPick={setOverlayComp} />;
      case 'mode':       return <ModeScreen      s={state} set={update} L={L} />;
      case 'curriculum':
        if (lessonN) {
          return <LessonScreen s={state} set={update} L={L} lang={settings.lang} lessonN={lessonN}
                               closeLesson={(toN) => setLessonN(toN || null)} />;
        }
        return <CurriculumScreen s={state} set={update} L={L} lang={settings.lang}
                                 openLesson={(n) => setLessonN(n)} />;
      case 'ai':         return <AIScreen        s={state} set={update} L={L} />;
      case 'energy':     return <EnergyScreen    s={state}              L={L} />;
      case 'trend':      return <TrendScreen     s={state}              L={L} />;
      case 'alarm':      return <AlarmScreen     s={state} set={update} L={L} />;
      case 'settings':
        return <SettingsScreenIntegrated s={state} set={update} L={L} settings={settings} setSettings={setSettings} />;
      default:           return <DashboardScreen s={state} set={update} L={L} />;
    }
  };

  // when switching out of curriculum, also clear lesson
  const goView = (v) => {
    setView(v);
    if (v !== 'curriculum') setLessonN(null);
  };

  const crumbLabel = NAV.find(n => n.id === view)?.label;
  const activeAlarms = state.alarms.filter(a => !a.ack).length;
  const isFault = state.alarms.some(a => a.sev === 'crit' && !a.ack);
  const lessonTitle = lessonN ? window.CURRICULUM.find(c => c.n === lessonN)?.title[settings.lang] : null;

  return (
    <Stage>
      <div className="bezel">
        {/* Top brand plate */}
        <div className="bezel-plate">
          <div className="ieg-mark">
            <div className="badge">IEG</div>
            <h1>{L('panel')}</h1>
          </div>
          <div className="url">www.ieg.kr · Educational HVAC Laboratory</div>
        </div>

        {/* LCD */}
        <div className="lcd">
          <div className="lcd-inner">
            <div className="app">
              {/* HEADER */}
              <div className="app-header">
                <div className="h-brand">
                  <div className="logo">AI</div>
                  <div>
                    <div className="name" data-screen-label="brand">{L('brand')}</div>
                  </div>
                </div>
                <div className="h-title">
                  <span>{crumbLabel}</span>
                  {lessonTitle && (
                    <>
                      <Icon name="chev" size={12} stroke="var(--ink-4)" />
                      <span style={{ color: 'var(--ink-2)', fontSize: 13, fontWeight: 600 }}>{lessonTitle}</span>
                    </>
                  )}
                </div>
                <div className="h-right">
                  {/* Version toggle (Korea / Malaysia) — integrated into header */}
                  <div className="seg" style={{ height: 26, padding: 2 }}>
                    <button className={state.version === 'korea' ? 'active' : ''}
                            onClick={() => setVersion('korea')}
                            style={{ padding: '3px 10px', fontSize: 10.5 }}>🇰🇷 KR</button>
                    <button className={state.version === 'malaysia' ? 'active' : ''}
                            onClick={() => setVersion('malaysia')}
                            style={{ padding: '3px 10px', fontSize: 10.5 }}>🇲🇾 MY</button>
                  </div>
                  <div className={`pill ${isFault ? 'warn' : ''}`}>
                    <span className="dot"></span>{L(isFault ? 'status_offline' : 'status_online')}
                  </div>
                  <div className="lang-tog">
                    <button className={settings.lang === 'en' ? 'active' : ''} onClick={() => setSettings({ lang: 'en' })}>EN</button>
                    <button className={settings.lang === 'ko' ? 'active' : ''} onClick={() => setSettings({ lang: 'ko' })}>KO</button>
                  </div>
                  <div className="time">{clockStr}</div>
                  <div style={{ fontSize: 11 }}>{dateStr}</div>
                </div>
              </div>

              {/* SIDEBAR */}
              <div className="sidebar">
                {NAV.map(n => (
                  <button key={n.id}
                    className={`nav-item ${view === n.id ? 'active' : ''}`}
                    onClick={() => goView(n.id)}
                    data-screen-label={n.label}>
                    <div className="ico"><Icon name={n.icon} size={20} /></div>
                    <span>{n.label}</span>
                    {n.id === 'alarm' && activeAlarms > 0 && <span className="badge-n">{activeAlarms}</span>}
                  </button>
                ))}
              </div>

              {/* MAIN */}
              <div className="main" data-screen-label={crumbLabel}>
                {renderScreen()}
                {overlayComp && (
                  <ComponentDetailOverlay s={state} set={update} L={L} lang={settings.lang}
                                          compKey={overlayComp} onClose={() => setOverlayComp(null)} />
                )}
              </div>
            </div>
          </div>
        </div>

      </div>
    </Stage>
  );
}

              <tr><td style={{ color: 'var(--ink-3)' }}>Power Supply</td><td className="num" style={{ textAlign: 'right' }}>3Φ 380V 60Hz</td></tr>

function RowK({ label, children }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10 }}>
      <span style={{ fontSize: 12, color: 'var(--ink-2)', fontWeight: 600 }}>{label}</span>
      {children}
    </div>
  );
}

// ── Stage: scale to fit viewport ────────────────────────────────────────
function Stage({ children }) {
  const wrapRef = useRef(null);
  useEffect(() => {
    const STAGE_W = 1600, STAGE_H = 1040;
    const fit = () => {
      const w = window.innerWidth, h = window.innerHeight;
      const sc = Math.min(w / STAGE_W, h / STAGE_H);
      const tx = (w - STAGE_W * sc) / 2;
      const ty = (h - STAGE_H * sc) / 2;
      if (wrapRef.current) {
        wrapRef.current.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
      }
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return (
    <div className="stage-root">
      <div className="stage" ref={wrapRef}>{children}</div>
    </div>
  );
}
