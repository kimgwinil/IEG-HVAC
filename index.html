<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IEG-HVAC AI Control System</title>
  <style>
/* ─────────────────────────────────────────────────────────────────────
   IEG-HVAC AI Control System — visual styles
   ───────────────────────────────────────────────────────────────────── */

@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg:        #EEF1F4;
  --bg-soft:  #F7F9FB;
  --panel:     #FFFFFF;
  --line:      #D9DEE5;
  --line-soft: #E7EBF0;
  --ink:       #0F1A2E;
  --ink-2:     #2E3A52;
  --ink-3:     #5B6577;
  --ink-4:     #8A93A4;
  --primary:   #14B8A6;
  --primary-d: #0E8A7C;
  --navy:      #0F2D55;

  /* card pastels */
  --mint:    #DCF1E6;
  --mint-d:  #1F8A5B;
  --sky:     #DDEBFB;
  --sky-d:   #2A6FDB;
  --peach:   #FBE3D5;
  --peach-d: #D97757;
  --lilac:   #E8E2F4;
  --lilac-d: #6B5BD2;
  --lemon:   #F6EDC8;
  --lemon-d: #9C7B14;
  --rose:    #FBD7DC;
  --rose-d:  #C0364E;

  --radius: 14px;
  --radius-sm: 10px;

  --font-sans: 'Pretendard', 'Pretendard Variable', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0a0a0c; height: 100%; }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'cv11', 'ss01';
  overflow: hidden;
}

button { font-family: inherit; cursor: default; }
input, select, textarea { font-family: inherit; }

/* ── Stage / scale wrapper ──────────────────────────────────────────── */
.stage-root {
  position: fixed; inset: 0;
  overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #1a1c22 0%, #08090b 70%);
}
.stage {
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 1040px;
  transform-origin: 0 0;
  display: grid; place-items: center;
}

/* ── Hardware bezel ─────────────────────────────────────────────────── */
.bezel {
  width: 1500px;
  height: 1000px;
  border-radius: 22px;
  background:
    linear-gradient(180deg, #3a3e46 0%, #2a2d34 100%);
  box-shadow:
    inset 0 1px 0 #5b606a,
    inset 0 -2px 0 rgba(0,0,0,.5),
    0 30px 80px rgba(0,0,0,.55),
    0 6px 0 rgba(0,0,0,.25);
  padding: 26px;
  display: grid;
  grid-template-rows: 56px 1fr;
  gap: 18px;
  position: relative;
}
/* subtle metal grain */
.bezel::before {
  content: ""; position: absolute; inset: 0; border-radius: 22px;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.015) 0 2px, transparent 2px 4px);
  pointer-events: none;
}

.bezel-plate {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
  background: linear-gradient(180deg, #1c1e23, #15171b);
  border: 1px solid #45494f;
  border-radius: 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  color: #d4d8e0;
}
.bezel-plate .ieg-mark {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-sans);
}
.bezel-plate .ieg-mark .badge {
  width: 30px; height: 30px; border-radius: 7px;
  background: linear-gradient(180deg, #14B8A6, #0E8A7C);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .04em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
}
.bezel-plate h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #c8ccd4;
}
.bezel-plate .url {
  font-family: var(--font-mono); font-size: 11px;
  color: #7c818b; letter-spacing: .04em;
}

/* The LCD screen — the actual UI */
.lcd {
  background: #000;
  border-radius: 4px;
  padding: 10px;
  border: 1px solid #18191c;
  box-shadow: inset 0 0 0 1px #2a2c32, 0 4px 16px rgba(0,0,0,.5);
}
.lcd-inner {
  width: 100%; height: 100%;
  background: var(--bg);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

/* ── HMI app shell (inside .lcd-inner) ──────────────────────────────── */
.app {
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: 108px 1fr;
  grid-template-rows: 52px 1fr;
  background: var(--bg);
  color: var(--ink);
}
.app-header {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 108px 1fr auto;
  align-items: center;
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.app-header .h-brand {
  height: 100%;
  display: flex; align-items: center; gap: 8px;
  padding-left: 14px;
  border-right: 1px solid var(--line-soft);
}
.h-brand .logo {
  width: 26px; height: 26px; border-radius: 6px;
  background: linear-gradient(135deg, #14B8A6, #0E8A7C);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .04em;
}
.h-brand .name {
  font-weight: 700; font-size: 12px; letter-spacing: .02em;
}
.app-header .h-title {
  padding-left: 18px;
  display: flex; align-items: center; gap: 14px;
  font-size: 13px; color: var(--ink-3);
  font-weight: 500;
}
.app-header .h-title .crumb {
  color: var(--ink); font-weight: 600; font-size: 15px;
}
.app-header .h-right {
  display: flex; align-items: center; gap: 12px;
  padding-right: 16px; color: var(--ink-3);
  font-size: 12px;
}
.app-header .pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px;
  border-radius: 999px;
  background: #ECF6F2;
  color: var(--mint-d);
  font-size: 11px; font-weight: 600;
  letter-spacing: .04em;
}
.app-header .pill .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--mint-d);
  box-shadow: 0 0 6px var(--mint-d);
}
.app-header .pill.warn { background: #FFF4E5; color: #B26A00; }
.app-header .pill.warn .dot { background: #E08C00; box-shadow: 0 0 6px #E08C00; }

.app-header .time {
  font-family: var(--font-mono); font-size: 13px; font-weight: 500;
  color: var(--ink-2);
}
.app-header .lang-tog {
  display: flex; border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden;
  font-size: 11px;
}
.app-header .lang-tog button {
  background: #fff; border: 0; padding: 4px 9px; color: var(--ink-3);
  font-weight: 600; letter-spacing: .04em;
}
.app-header .lang-tog button.active {
  background: var(--ink); color: #fff;
}

/* ── Sidebar nav ────────────────────────────────────────────────────── */
.sidebar {
  background: #fff;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 10px 8px;
  gap: 4px;
  position: relative;
}
.nav-item {
  background: transparent; border: 0;
  padding: 10px 6px;
  border-radius: 10px;
  display: grid;
  grid-template-rows: 24px auto;
  justify-items: center; gap: 4px;
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
  position: relative;
  transition: background .12s, color .12s;
}
.nav-item .ico { color: var(--ink-3); }
.nav-item:hover { background: #F1F4F8; }
.nav-item.active {
  background: linear-gradient(180deg, #E7F8F5, #DFF3EF);
  color: var(--primary-d);
}
.nav-item.active .ico { color: var(--primary-d); }
.nav-item.active::before {
  content: ""; position: absolute; left: -8px; top: 12px; bottom: 12px;
  width: 3px; border-radius: 3px;
  background: var(--primary);
}
.nav-item .badge-n {
  position: absolute; top: 4px; right: 4px;
  background: #C0364E; color: #fff;
  font-size: 9px; font-weight: 700;
  border-radius: 999px;
  min-width: 16px; height: 16px; padding: 0 5px;
  display: grid; place-items: center;
  letter-spacing: 0;
}

/* ── Main content area ─────────────────────────────────────────────── */
.main {
  padding: 16px 18px;
  overflow: hidden;
  position: relative;
  background: var(--bg);
  height: 100%;
  box-sizing: border-box;
}

/* Cards */
.card {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 14px;
  position: relative;
}
.card.glass {
  background: linear-gradient(180deg, #ffffff, #fbfcfd);
}
.card-h {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.card-h .title {
  font-size: 12px; font-weight: 600; letter-spacing: .06em;
  color: var(--ink-3); text-transform: uppercase;
}

/* Stat card (big number tile) */
.stat {
  border-radius: var(--radius);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--line-soft);
  min-height: 120px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 4px;
}
.stat .stat-h {
  display: flex; justify-content: space-between; align-items: center;
}
.stat .stat-label {
  font-size: 12px; font-weight: 600; color: var(--ink-3);
  letter-spacing: .02em;
}
.stat .stat-ico {
  width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center;
}
.stat .stat-val {
  font-family: var(--font-mono); font-weight: 500;
  font-size: 38px; line-height: 1;
  color: var(--ink);
  font-feature-settings: 'tnum';
  letter-spacing: -.02em;
}
.stat .stat-unit {
  font-family: var(--font-sans);
  font-size: 14px; color: var(--ink-3);
  margin-left: 6px; font-weight: 500;
}
.stat .stat-foot {
  font-size: 11px; color: var(--ink-4); font-weight: 500;
  display: flex; align-items: center; justify-content: space-between;
}
.stat .stat-trend {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--font-mono); font-weight: 500;
  padding: 2px 6px; border-radius: 999px;
  font-size: 10px;
}
.stat .stat-trend.up   { background: #FBE9EC; color: #B12A41; }
.stat .stat-trend.down { background: #E1F1E8; color: #16704C; }
.stat .stat-trend.flat { background: #ECEEF1; color: #5B6577; }

.stat.compact {
  min-height: 106px;
  padding: 12px 13px;
}
.stat.compact .stat-label {
  font-size: 11px;
}
.stat.compact .stat-ico {
  width: 28px; height: 28px;
}
.stat.compact .stat-val {
  font-size: 31px;
}
.stat.compact .stat-unit {
  font-size: 12px;
  margin-left: 4px;
}

.stat.tight {
  min-height: 88px;
  padding: 9px 10px;
}
.stat.tight .stat-label {
  font-size: 10px;
}
.stat.tight .stat-ico {
  width: 24px; height: 24px;
}
.stat.tight .stat-val {
  font-size: 24px;
}
.stat.tight .stat-unit {
  font-size: 11px;
  margin-left: 3px;
}
.stat.tight .stat-foot {
  font-size: 10px;
}

.stat.mint  .stat-ico { background: var(--mint);  color: var(--mint-d); }
.stat.sky   .stat-ico { background: var(--sky);   color: var(--sky-d); }
.stat.peach .stat-ico { background: var(--peach); color: var(--peach-d); }
.stat.lilac .stat-ico { background: var(--lilac); color: var(--lilac-d); }
.stat.lemon .stat-ico { background: var(--lemon); color: var(--lemon-d); }
.stat.rose  .stat-ico { background: var(--rose);  color: var(--rose-d); }

/* Sparkline svg */
.spark { display: block; width: 100%; height: 36px; }

/* Section title */
.sect-title {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  color: var(--ink-3); text-transform: uppercase;
  margin: 4px 0 8px 0;
  display: flex; justify-content: space-between; align-items: center;
}

/* Buttons & toggles */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink-2);
  font-size: 12px; font-weight: 600;
  letter-spacing: .02em;
}
.btn:hover { background: #F7F9FB; }
.btn.primary {
  background: var(--ink); color: #fff; border-color: var(--ink);
}
.btn.primary:hover { background: var(--navy); }
.btn.danger {
  background: #C0364E; color: #fff; border-color: #C0364E;
}
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { height: 26px; padding: 0 10px; font-size: 11px; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 13px; border-radius: 10px; }

/* Segmented control */
.seg {
  display: inline-flex; padding: 3px;
  background: #ECEFF3; border-radius: 10px;
  gap: 2px;
}
.seg button {
  background: transparent; border: 0;
  padding: 6px 14px;
  font-size: 12px; font-weight: 600;
  color: var(--ink-3);
  border-radius: 7px;
  letter-spacing: .02em;
}
.seg button.active {
  background: #fff; color: var(--ink);
  box-shadow: 0 1px 2px rgba(15,26,46,.08);
}

/* Slider */
.slider-row { display: grid; gap: 6px; }
.slider-h { display: flex; justify-content: space-between; align-items: baseline; }
.slider-h .lbl { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.slider-h .val { font-family: var(--font-mono); font-weight: 500; font-size: 18px; color: var(--ink); }
.slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 6px; background: #E7EBF0;
  border-radius: 999px; outline: 0;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff; border: 2px solid var(--primary);
  box-shadow: 0 2px 6px rgba(20,184,166,.35);
  cursor: pointer;
}
.slider::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff; border: 2px solid var(--primary);
  box-shadow: 0 2px 6px rgba(20,184,166,.35);
  cursor: pointer;
}
.slider.warm::-webkit-slider-thumb { border-color: var(--peach-d); box-shadow: 0 2px 6px rgba(217,119,87,.35); }
.slider.cool::-webkit-slider-thumb { border-color: var(--sky-d); box-shadow: 0 2px 6px rgba(42,111,219,.35); }

/* Toggle */
.toggle {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--ink-2); font-weight: 600;
}
.toggle .sw {
  width: 36px; height: 20px; border-radius: 999px;
  background: #D6DBE2; position: relative;
  transition: background .18s;
}
.toggle .sw::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.18);
  transition: left .18s;
}
.toggle.on .sw { background: var(--primary); }
.toggle.on .sw::after { left: 18px; }

/* Big mode tiles */
.mode-grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(4, 1fr);
}
.mode-tile {
  background: #fff; border: 1px solid var(--line-soft);
  border-radius: var(--radius); padding: 14px;
  display: grid; gap: 4px;
  position: relative;
  transition: transform .15s, box-shadow .15s;
}
.mode-tile .ico {
  width: 36px; height: 36px; border-radius: 9px;
  display: grid; place-items: center;
  background: #F1F4F8; color: var(--ink-3);
  margin-bottom: 8px;
}
.mode-tile .name { font-weight: 700; font-size: 14px; }
.mode-tile .desc { font-size: 11px; color: var(--ink-4); }
.mode-tile.active {
  border-color: transparent;
  box-shadow: 0 0 0 2px var(--ink);
}
.mode-tile.active.cool .ico { background: var(--sky); color: var(--sky-d); }
.mode-tile.active.cool { box-shadow: 0 0 0 2px var(--sky-d); }
.mode-tile.active.heat .ico { background: var(--peach); color: var(--peach-d); }
.mode-tile.active.heat { box-shadow: 0 0 0 2px var(--peach-d); }
.mode-tile.active.auto .ico { background: var(--mint); color: var(--mint-d); }
.mode-tile.active.auto { box-shadow: 0 0 0 2px var(--mint-d); }
.mode-tile.active.dry  .ico { background: var(--lilac); color: var(--lilac-d); }
.mode-tile.active.dry  { box-shadow: 0 0 0 2px var(--lilac-d); }
.mode-tile.active.fan  .ico { background: var(--lemon); color: var(--lemon-d); }
.mode-tile.active.fan  { box-shadow: 0 0 0 2px var(--lemon-d); }
.mode-tile.disabled { opacity: .35; }

/* Tabular tables */
.table { width: 100%; border-collapse: collapse; font-size: 12px; }
.table th, .table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line-soft); }
.table th { color: var(--ink-4); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; background: #F7F9FB; }
.table td.num { font-family: var(--font-mono); font-feature-settings: 'tnum'; }
.table tr:last-child td { border-bottom: 0; }

/* Schematic */
.schem-svg { display: block; width: 100%; height: 100%; }
.schem-svg .node-bg { fill: #fff; stroke: var(--line); }
.schem-svg .node-bg.run { stroke: var(--mint-d); }
.schem-svg .pipe { stroke: #B8C0CC; stroke-width: 2.6; fill: none; }
.schem-svg .pipe.hot  { stroke: #D97757; }
.schem-svg .pipe.cold { stroke: #2A6FDB; }
.schem-svg .pipe.run  { stroke-dasharray: 6 6; animation: flow 1.4s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.schem-svg .lbl-num {
  font-family: var(--font-mono); font-size: 9px;
  font-weight: 700; fill: #fff;
}
.schem-svg .pin-bg { fill: var(--ink); }
.schem-svg .lbl { font-size: 11px; fill: var(--ink); font-weight: 600; }
.schem-svg .lbl-sub { font-size: 10px; fill: var(--ink-4); }
.schem-svg .val { font-family: var(--font-mono); font-size: 11px; fill: var(--mint-d); font-weight: 600; }

/* AI cards */
.ai-rec {
  background: #fff; border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 12px 14px; display: grid; gap: 4px;
  position: relative; padding-left: 44px;
}
.ai-rec::before {
  content: ""; position: absolute; left: 14px; top: 14px;
  width: 20px; height: 20px; border-radius: 6px;
  background: var(--mint); color: var(--mint-d);
}
.ai-rec .ai-ico {
  position: absolute; left: 12px; top: 12px;
  width: 24px; height: 24px; border-radius: 6px;
  background: var(--mint); color: var(--mint-d);
  display: grid; place-items: center;
}
.ai-rec::before { display: none; }
.ai-rec .t { font-weight: 700; font-size: 13px; color: var(--ink); }
.ai-rec .d { font-size: 11.5px; color: var(--ink-3); }

/* Alarms */
.alarm-row {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 12px; align-items: center;
  padding: 8px 10px;
  border-radius: 10px;
  background: #fff;
  border: 1px solid var(--line-soft);
  margin-bottom: 8px;
  font-size: 12px;
}
.alarm-row .sev {
  font-family: var(--font-mono); font-size: 10px;
  padding: 2px 6px; border-radius: 999px;
  background: #ECEEF1; color: var(--ink-3);
  text-align: center; font-weight: 700; letter-spacing: .05em;
}
.alarm-row .sev.warn { background: #FFF4E5; color: #B26A00; }
.alarm-row .sev.crit { background: #FBE9EC; color: #B12A41; }
.alarm-row .t {
  color: var(--ink-2);
}
.alarm-row .when { font-family: var(--font-mono); font-size: 11px; color: var(--ink-4); }
.alarm-row.ack { opacity: .55; }

/* Tweaks panel host overrides */
.twk-hd b { color: #14B8A6; }

  </style>

<body>
  <div id="root"></div>

  <script>
// Bilingual dictionary — Korean & English
window.I18N = {
  // brand
  brand: { en: "IEG-HVAC AI Control System", ko: "IEG-HVAC AI 제어 시스템" },
  panel: { en: "AI CONTROL PANEL", ko: "AI 제어 패널" },

  // nav

  <script type="text/babel">
// HVAC simulation engine — 1Hz tick, drives all sensor values from user controls.
// Single source of truth for the prototype's "live" feel.

const { useEffect, useRef, useState } = React;

// Default state for the simulation. User controls live here too so screens
// share a single store.
function makeInitialState() {
  return {
    // version: 'korea' includes heating, 'malaysia' is cooling-only
    version: 'korea',

    // operating
    power: true,
    mode: 'cool',          // 'cool' | 'heat' | 'auto' | 'dry' | 'fan' | 'off'
    targetTemp: 24,        // °C
    targetRH: 50,          // %
    targetCO2: 900,        // ppm ceiling
    fanSpeed: 3,           // 0..5
    humidifierOn: true,
    airPurifierOn: true,
    ventilationOn: true,

    // sensors (will be updated each tick)
    indoorTemp: 27.4,
    indoorRH: 58,
    outdoorTemp: 31.2,
    outdoorRH: 64,
    co2: 1180,
    pm25: 42,
    powerKW: 0,            // electrical input
    eer: 0,                // cooling output / electrical input
    compFreqHz: 0,         // 0..120

    // derived state
    compressorOn: false,
    heaterOn: false,
    fourWayValve: 'cool',  // 'cool' | 'heat'

    // refrigerant cycle state
    exvOpenPct: 35,   // EXV opening 0–100 %
    superheat:  5.5,  // evaporator outlet superheat °C
    subcooling: 3.0,  // condenser outlet subcooling °C

    // history (for sparklines + trend page)
    hist: {
      indoorTemp: [],
      indoorRH: [],
      co2: [],
      powerKW: [],
      eer: [],
      outdoorTemp: [],
      pm25: [],
    },

    // alarms
    alarms: [
      { id: 'al_filter', sev: 'info', t: '08:14:22', ack: false },
      { id: 'al_defrost', sev: 'info', t: '08:32:05', ack: false },
    ],

    // event log
    events: [],

    // wall clock — simulated time (advances with ticks)
    clockMin: 9 * 60 + 24, // 09:24
  };
}

// ── helpers ───────────────────────────────────────────────────────────────
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp  = (a, b, t) => a + (b - a) * t;

// Push to a ring buffer, capped at MAX entries.
const MAX_HIST = 360; // 6 min @ 1Hz, but we step time faster for visuals
function pushHist(arr, v) {
  arr.push(v);
  if (arr.length > MAX_HIST) arr.shift();
}

// One simulation tick. Returns the next state.
function step(s, dt = 1) {
  const next = { ...s, hist: { ...s.hist } };
  const isKorea = s.version === 'korea';

  // ── POWER OFF: freeze everything, zero electrical, skip history ───────
  if (!s.power) {
    next.powerKW      = 0;
    next.eer          = 0;
    next.compFreqHz   = 0;
    next.compressorOn = false;
    next.heaterOn     = false;
    next.exvOpenPct   = 0;
    next.superheat    = 0;
    next.subcooling   = 0;
    // hist arrays kept by reference — no new data pushed (graphs freeze)
    next.clockMin = (s.clockMin + 1) % (24 * 60);
    // clear active alarms (no monitoring when offline)
    next.alarms = s.alarms.filter(a => a.id !== 'al_high_co2' && a.id !== 'al_comp_hz');
    return next;
  }

  // ── thermal model ────────────────────────────────────────────────────
  const indoor = s.indoorTemp;
  const outdoor = s.outdoorTemp;
  const target = s.targetTemp;
  const fan = s.fanSpeed; // 0..5

  // effective mode (auto chooses based on delta)
  let effMode = s.mode;
  if (effMode === 'auto') {
    effMode = indoor > target + 0.5 ? 'cool' : (isKorea && indoor < target - 0.5 ? 'heat' : 'fan');
  }
  if (!isKorea && effMode === 'heat') effMode = 'cool'; // malaysia no heat
  if (!s.power) effMode = 'off';

  // hysteresis: compressor / heater on/off bands
  const wantCool = effMode === 'cool' || effMode === 'dry';
  const wantHeat = effMode === 'heat' && isKorea;
  const deltaCool = indoor - target; // positive = need cooling
  const deltaHeat = target - indoor;

  let compressorOn = s.compressorOn;
  if (wantCool) {
    if (deltaCool > 0.3) compressorOn = true;
    if (deltaCool < -0.4) compressorOn = false;
  } else {
    compressorOn = false;
  }

  let heaterOn = s.heaterOn;
  if (wantHeat) {
    if (deltaHeat > 0.3) heaterOn = true;
    if (deltaHeat < -0.4) heaterOn = false;
  } else {
    heaterOn = false;
  }

  // compressor inverter frequency — scales with load
  let compFreqHz = 0;
  if (compressorOn) {
    compFreqHz = clamp(35 + Math.abs(deltaCool) * 14 + fan * 2, 35, 110);
  } else if (heaterOn) {
    compFreqHz = 0;
  }

  // 4-way valve position (heat pump)
  const fourWayValve = wantHeat ? 'heat' : 'cool';

  // ── EXV / superheat / subcooling ─────────────────────────────────────
  const SH_TARGET = 6.0;
  let exvOpen = s.exvOpenPct ?? 35;
  if (compressorOn) {
    const shErr = (s.superheat ?? 5.5) - SH_TARGET;
    exvOpen = clamp(exvOpen + shErr * 3.0 * dt, 10, 92);
  } else {
    exvOpen = clamp(exvOpen - 3 * dt, 0, 100);
  }
  const shRef = compressorOn
    ? clamp(3.5 + (1 - exvOpen / 100) * 12 - fan * 0.4, 1.5, 20)
    : 0;
  const nextSH = lerp(s.superheat ?? 5.5, shRef, 0.07 * dt) + (Math.random() - 0.5) * 0.18;
  const scRef = compressorOn ? clamp(2.5 + (outdoor - 25) * 0.12, 1, 10) : 0;
  const nextSC = lerp(s.subcooling ?? 3.0, scRef, 0.05 * dt) + (Math.random() - 0.5) * 0.08;

  // heat-flow rates (°C/s)
  const fanFactor = 0.6 + fan * 0.18; // 0.6..1.5
  const coolRate = compressorOn ? 0.012 * fanFactor * (compFreqHz / 60) : 0;
  const heatRate = heaterOn ? 0.014 * fanFactor : 0;
  const leakRate = (outdoor - indoor) * 0.00045; // envelope leakage

  let nextIndoor = indoor + (-coolRate + heatRate + leakRate) * dt * 6;
  // small noise
  nextIndoor += (Math.random() - 0.5) * 0.02;

  // ── humidity ─────────────────────────────────────────────────────────
  let rh = s.indoorRH;
  const humOn = s.humidifierOn && s.power;
  if (humOn) rh += (s.targetRH - rh) * 0.012 * dt * 4;
  if (wantCool && compressorOn) rh -= 0.06 * dt; // coil condenses water
  rh += (Math.random() - 0.5) * 0.15;
  rh = clamp(rh, 15, 95);

  // ── CO2 ──────────────────────────────────────────────────────────────
  let co2 = s.co2;
  // occupancy adds CO2 over time
  co2 += 0.9 * dt;
  if (s.ventilationOn && fan > 0) {
    co2 -= (co2 - 420) * 0.018 * dt * (fan / 3);
  }
  co2 += (Math.random() - 0.5) * 4;
  co2 = clamp(co2, 380, 2200);

  // ── PM2.5 ────────────────────────────────────────────────────────────
  let pm = s.pm25;
  if (s.airPurifierOn && s.power) {
    pm -= (pm - 8) * 0.025 * dt;
  } else {
    pm += 0.18 * dt;
  }
  pm += (Math.random() - 0.5) * 0.6;
  pm = clamp(pm, 4, 180);

  // ── outdoor drift ────────────────────────────────────────────────────
  // slow diurnal-like drift
  let outdoorT = outdoor + Math.sin(Date.now() / 60000) * 0.01 + (Math.random() - 0.5) * 0.04;
  outdoorT = clamp(outdoorT, 18, 38);

  // ── electrical model ─────────────────────────────────────────────────
  let kw = 0.04; // controller + standby
  if (compressorOn) kw += 0.9 + (compFreqHz / 110) * 2.1; // ~0.9..3.0
  if (heaterOn) kw += 3.0;
  if (s.power && fan > 0) kw += 0.05 + fan * 0.06;
  if (humOn) kw += 0.08;
  if (s.airPurifierOn && s.power) kw += 0.07;
  kw += (Math.random() - 0.5) * 0.02;
  kw = Math.max(0.03, kw);

  // Cooling capacity (kW) — only meaningful in cooling
  const coolingKW = compressorOn ? (1.5 + (compFreqHz / 110) * 2.2) : 0;
  const eer = compressorOn ? coolingKW / kw * 3.412 : (heaterOn ? 0 : (s.eer * 0.9));

  // ── push history ─────────────────────────────────────────────────────
  next.hist.indoorTemp  = [...s.hist.indoorTemp];
  next.hist.indoorRH    = [...s.hist.indoorRH];
  next.hist.co2         = [...s.hist.co2];
  next.hist.powerKW     = [...s.hist.powerKW];
  next.hist.eer         = [...s.hist.eer];
  next.hist.outdoorTemp = [...s.hist.outdoorTemp];
  next.hist.pm25        = [...(s.hist.pm25 || [])];
  pushHist(next.hist.indoorTemp,  nextIndoor);
  pushHist(next.hist.indoorRH,    rh);
  pushHist(next.hist.co2,         co2);
  pushHist(next.hist.powerKW,     kw);
  pushHist(next.hist.eer,         eer);
  pushHist(next.hist.outdoorTemp, outdoorT);
  pushHist(next.hist.pm25,        pm);

  // ── assemble next state ──────────────────────────────────────────────
  next.indoorTemp    = nextIndoor;
  next.indoorRH      = rh;
  next.outdoorTemp   = outdoorT;
  next.co2           = co2;
  next.pm25          = pm;
  next.powerKW       = kw;
  next.eer           = eer;
  next.compFreqHz    = compFreqHz;
  next.compressorOn  = compressorOn;
  next.heaterOn      = heaterOn;
  next.fourWayValve  = fourWayValve;
  next.exvOpenPct    = exvOpen;
  next.superheat     = clamp(nextSH, 0, 25);
  next.subcooling    = clamp(nextSC, 0, 12);
  next.clockMin = (s.clockMin + 1) % (24 * 60); // 1 sim-minute per tick

  // ── alarms ────────────────────────────────────────────────────────────
  // refresh CO2 alarm
  let alarms = s.alarms.filter(a => a.id !== 'al_high_co2');
  if (co2 > s.targetCO2) {
    alarms = [{ id: 'al_high_co2', sev: 'warn', t: fmtClock(next.clockMin), ack: false }, ...alarms];
  }
  if (compFreqHz > 100) {
    if (!alarms.find(a => a.id === 'al_comp_hz')) {
      alarms = [{ id: 'al_comp_hz', sev: 'info', t: fmtClock(next.clockMin), ack: false }, ...alarms];
    }
  } else {
    alarms = alarms.filter(a => a.id !== 'al_comp_hz');
  }
  next.alarms = alarms.slice(0, 8);

  return next;
}

function fmtClock(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// Pre-populate history with a believable curve so charts aren't empty at load.
function seedHistory(s) {
  let cur = { ...s };
  for (let i = 0; i < 180; i++) cur = step(cur, 1);

  // Guarantee compressor is visibly running when the dashboard first opens.
  // 180 seed ticks often land in the dead band (±0.4°C of target), leaving
  // the compressor idle and giving the impression nothing works.
  const effMode = cur.mode === 'auto'
    ? (cur.indoorTemp > cur.targetTemp + 0.5 ? 'cool' : 'heat')
    : cur.mode;
  if (cur.power && (effMode === 'cool' || effMode === 'dry')) {
    cur.indoorTemp    = cur.targetTemp + 2.0; // just above ON threshold
    cur.compressorOn  = true;
  } else if (cur.power && effMode === 'heat' && cur.version === 'korea') {
    cur.indoorTemp    = cur.targetTemp - 2.5;
    cur.heaterOn      = true;
  }
  return cur;
}

// ── React hook ───────────────────────────────────────────────────────────
function useSimulation() {
  const [state, setState] = useState(() => seedHistory(makeInitialState()));
  const stateRef = useRef(state);
  stateRef.current = state;

  useEffect(() => {
    const id = setInterval(() => {
      setState(prev => step(prev, 1));
    }, 1000);
    return () => clearInterval(id);
  }, []);

  // setter helper — merge partial updates and reseed derived bits when needed
  const update = (patch) => {
    setState(prev => ({ ...prev, ...patch }));
  };

  return [state, update];
}

window.useSimulation = useSimulation;
window.fmtClock = fmtClock;

// ── Stat card ────────────────────────────────────────────────────────────
function StatCard({ tone = 'mint', icon, label, value, unit, foot, trend, sparkData, sparkColor, compact = false, tight = false }) {
  return (
    <div className={`stat ${tone} ${compact ? 'compact' : ''} ${tight ? 'tight' : ''}`}>
      <div className="stat-h">
        <div className="stat-label">{label}</div>

      </div>

        <span className="stat-val">{value}</span>
        {unit && <span className="stat-unit">{unit}</span>}
      </div>

      ) : (
        <div className="stat-foot">
          <span>{foot}</span>

              {trend.label}
            </span>
          )}
        </div>
      )}
    </div>
  );
}

// ── Sparkline ────────────────────────────────────────────────────────────
function Spark({ data, color = '#14B8A6', height = 36, fill = true, smooth = true, padY = 6 }) {
  const path = useMemo(() => {
    if (!data || data.length < 2) return { line: '', area: '' };
    const w = 200, h = height;
    const min = Math.min(...data), max = Math.max(...data);
    const range = max - min || 1;
    const xs = data.map((_, i) => (i / (data.length - 1)) * w);
    const ys = data.map(v => h - padY - ((v - min) / range) * (h - padY * 2));
    let line = '';
    if (smooth) {
      // Catmull-Rom to bezier
      for (let i = 0; i < xs.length - 1; i++) {
        const x0 = xs[Math.max(0, i - 1)], y0 = ys[Math.max(0, i - 1)];
        const x1 = xs[i], y1 = ys[i];
        const x2 = xs[i + 1], y2 = ys[i + 1];
        const x3 = xs[Math.min(xs.length - 1, i + 2)], y3 = ys[Math.min(ys.length - 1, i + 2)];
        const cp1x = x1 + (x2 - x0) / 6;
        const cp1y = y1 + (y2 - y0) / 6;
        const cp2x = x2 - (x3 - x1) / 6;
        const cp2y = y2 - (y3 - y1) / 6;
        if (i === 0) line += `M ${x1} ${y1} `;
        line += `C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2} `;
      }
    } else {
      line = xs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x} ${ys[i]}`).join(' ');
    }
    const area = `${line} L ${w} ${h} L 0 ${h} Z`;
    return { line, area };
  }, [data, height, smooth, padY]);

  return (
    <svg className="spark" viewBox={`0 0 200 ${height}`} preserveAspectRatio="none">
      {fill && (
        <path d={path.area} fill={color} opacity="0.12" />
      )}
      <path d={path.line} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

// ── Linechart (larger, with axes) ────────────────────────────────────────
function LineChart({ series, height = 220, padY = 18, padL = 36, padR = 12, padT = 12, padB = 22, yTicks = 4, xLabels = [] }) {
  // series: [{ label, color, data }]
  if (!series || !series.length) return null;
  const w = 800; // viewBox width
  const h = height;
  const data = series.flatMap(s => s.data);
  const min = Math.floor(Math.min(...data) - 1);
  const max = Math.ceil(Math.max(...data) + 1);
  const range = max - min || 1;
  const len = Math.max(...series.map(s => s.data.length));
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const xAt = i => padL + (i / (len - 1)) * plotW;
  const yAt = v => padT + plotH - ((v - min) / range) * plotH;

  // path generator
  const pathFor = (arr) => {
    if (arr.length < 2) return '';
    let s = `M ${xAt(0)} ${yAt(arr[0])}`;
    for (let i = 1; i < arr.length; i++) {
      const xp = xAt(i - 1), yp = yAt(arr[i - 1]);
      const x = xAt(i), y = yAt(arr[i]);
      const cx = (xp + x) / 2;
      s += ` C ${cx} ${yp}, ${cx} ${y}, ${x} ${y}`;
    }
    return s;
  };

  const yTickVals = [];
  for (let i = 0; i <= yTicks; i++) {
    yTickVals.push(min + (range * i) / yTicks);
  }

  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: 'block', width: '100%', height }}>
      {/* gridlines */}
      {yTickVals.map((v, i) => (
        <g key={i}>
          <line x1={padL} x2={w - padR} y1={yAt(v)} y2={yAt(v)} stroke="#E7EBF0" strokeWidth="1" />
          <text x={padL - 6} y={yAt(v) + 4} fontSize="10" textAnchor="end" fill="#8A93A4" fontFamily="JetBrains Mono">
            {Number.isInteger(v) ? v : v.toFixed(1)}
          </text>
        </g>
      ))}
      {/* x labels */}
      {xLabels.map((l, i) => {
        const x = padL + (i / Math.max(1, xLabels.length - 1)) * plotW;
        return (
          <text key={i} x={x} y={h - 6} fontSize="10" textAnchor="middle" fill="#8A93A4" fontFamily="JetBrains Mono">{l}</text>
        );
      })}
      {/* series */}
      {series.map((s, idx) => (
        <g key={idx}>
          <path d={pathFor(s.data)} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
        </g>
      ))}
    </svg>
  );
}

// ── Donut / gauge ────────────────────────────────────────────────────────
function Donut({ value, max = 100, label, color = '#14B8A6', sub, size = 130 }) {
  const r = 52, c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, value / max));
  const labelSize = size <= 112 ? 20 : 22;
  const subSize = size <= 112 ? 9 : 10;
  return (
    <svg width={size} height={size} viewBox="0 0 130 130">
      <circle cx="65" cy="65" r={r} stroke="#ECEFF3" strokeWidth="11" fill="none" />
      <circle
        cx="65" cy="65" r={r}
        stroke={color} strokeWidth="11" fill="none"
        strokeLinecap="round"
        strokeDasharray={c}
        strokeDashoffset={c - pct * c}
        transform="rotate(-90 65 65)"
      />
      <text x="65" y="63" textAnchor="middle" fontFamily="JetBrains Mono" fontSize={labelSize} fontWeight="600" fill="#0F1A2E">{label}</text>
      {sub && <text x="65" y="80" textAnchor="middle" fontFamily="Pretendard" fontSize={subSize} fill="#5B6577">{sub}</text>}
    </svg>
  );
}

// ── Slider row ───────────────────────────────────────────────────────────
function SliderRow({ label, value, min, max, step = 1, unit = '', onChange, color = 'cool' }) {
  return (
    <div className="slider-row">
      <div className="slider-h">
        <span className="lbl">{label}</span>
        <span className="val">{value}{unit && <span style={{ fontSize: 12, color: 'var(--ink-3)', marginLeft: 4 }}>{unit}</span>}</span>
      </div>
      <input className={`slider ${color}`} type="range" min={min} max={max} step={step} value={value}
             onChange={e => onChange(Number(e.target.value))} />
    </div>
  );
}

// ── Toggle ───────────────────────────────────────────────────────────────
function Toggle({ on, onChange, label }) {
  return (
    <button className={`toggle ${on ? 'on' : ''}`} onClick={() => onChange(!on)} style={{ background: 'transparent', border: 0 }}>
      <span className="sw"></span>
      {label && <span>{label}</span>}
    </button>
  );
}

// ── Bar segment chart (for energy breakdown) ─────────────────────────────
function StackedBar({ segments, height = 12 }) {
  const total = segments.reduce((a, b) => a + b.value, 0) || 1;
  return (
    <div style={{ display: 'flex', height, borderRadius: 999, overflow: 'hidden', background: '#ECEFF3' }}>
      {segments.map((s, i) => (
        <div key={i} style={{ width: `${(s.value / total) * 100}%`, background: s.color }} title={`${s.label}: ${s.value}`} />
      ))}
    </div>
  );
}

// expose globally
Object.assign(window, { Icon, StatCard, Spark, LineChart, Donut, SliderRow, Toggle, StackedBar });

  </script>

function Legend({ dot, label }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, color: 'var(--ink-3)' }}>
      <span style={{ width: 8, height: 8, borderRadius: '50%', background: dot }}></span>{label}
    </span>
  );
}

function ToggleLine({ on, onChange, label }) {
  return (
    <button className={`toggle ${on ? 'on' : ''}`} onClick={() => onChange(!on)}
            style={{ background: 'transparent', border: 0, padding: 0 }}>
      <span className="sw"></span>
      <span style={{ color: 'var(--ink-2)', fontSize: 12, fontWeight: 600 }}>{label}</span>
    </button>
  );
}

function DualAxisChart({ hist, L }) {
  const N = 60;
  const t = hist.indoorTemp.slice(-N), rh = hist.indoorRH.slice(-N), co2 = hist.co2.slice(-N);
  const w = 800, h = 200, padL = 36, padR = 36, padT = 12, padB = 22;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = Math.max(t.length, 2);
  const xAt = i => padL + (i / (n - 1)) * plotW;
  const seriesPath = (arr, mn, mx) => {
    if (arr.length < 2) return '';
    const range = mx - mn || 1;
    const yAt = v => padT + plotH - ((v - mn) / range) * plotH;
    let s = `M ${xAt(0)} ${yAt(arr[0])}`;
    for (let i = 1; i < arr.length; i++) {
      const xp = xAt(i - 1), yp = yAt(arr[i - 1]), x = xAt(i), y = yAt(arr[i]), cx = (xp + x) / 2;
      s += ` C ${cx} ${yp}, ${cx} ${y}, ${x} ${y}`;
    }
    return s;
  };
  const tMin = 18, tMax = 30, co2Min = 400, co2Max = 1600, rhMin = 20, rhMax = 80;
  const yAtT = v => padT + plotH - ((v - tMin) / (tMax - tMin)) * plotH;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: '100%' }}>
      {[18, 22, 26, 30].map(v => (
        <g key={v}>
          <line x1={padL} x2={w - padR} y1={yAtT(v)} y2={yAtT(v)} stroke="#E7EBF0" />
          <text x={padL - 6} y={yAtT(v) + 4} fontSize="10" textAnchor="end" fill="#8A93A4" fontFamily="JetBrains Mono">{v}°</text>
        </g>
      ))}
      {[600, 1000, 1400].map(v => (
        <text key={v} x={w - padR + 4} y={padT + plotH - ((v - co2Min) / (co2Max - co2Min)) * plotH + 4}
              fontSize="10" textAnchor="start" fill="#8A93A4" fontFamily="JetBrains Mono">{v}</text>
      ))}
      <path d={seriesPath(t, tMin, tMax)} fill="none" stroke="#2A6FDB" strokeWidth="2" />
      <path d={seriesPath(rh, rhMin, rhMax)} fill="none" stroke="#1F8A5B" strokeWidth="2" opacity="0.85" />
      <path d={seriesPath(co2, co2Min, co2Max)} fill="none" stroke="#D97757" strokeWidth="2" opacity="0.85" />
    </svg>
  );
}

// ── SCHEMATIC ────────────────────────────────────────────────────────────
function SchematicScreen({ s, set, L, lang, onPick }) {
  const isKorea = s.version === 'korea';
  const flow    = s.compressorOn || s.heaterOn;
  const heat    = s.heaterOn || s.fourWayValve === 'heat';
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) 268px', gap: 8, height: '100%', overflow: 'hidden' }}>
      {/* ── SVG schematic ── */}
      <div className="card" style={{ padding: 0, overflow: 'hidden', display: 'grid', gridTemplateRows: 'auto minmax(0, 1fr)', minHeight: 0 }}>
        <div className="card-h" style={{ padding: '6px 10px 0' }}>
          <div>
            <div className="title">{L('nav_schematic')} — {isKorea ? 'KOREA' : 'MALAYSIA'} · {L('mode_' + s.mode).toUpperCase()}</div>
            <div style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 2 }}>Click any component to view its principle</div>
          </div>
          <div style={{ display: 'flex', gap: 6, fontSize: 9.5 }}>
            <Legend dot="#D97757" label="Hot gas / High-P" />
            <Legend dot="#2A6FDB" label="Liquid / Low-P" />
            <Legend dot="#1F8A5B" label="Air flow" />
          </div>
        </div>
        <div style={{ padding: '0 6px 6px', minHeight: 0 }}>
          <SchematicSVG s={s} isKorea={isKorea} flow={flow} heat={heat} L={L} onPick={onPick} />
        </div>
      </div>

      {/* ── Right: operation + outdoor status + accessories ── */}
      <div style={{ minHeight: 0 }}>
        <SchematicControlPanel s={s} set={set} L={L} lang={lang} isKorea={isKorea} sections={['control', 'status', 'accessories']} statusLayout="horizontal" compact />
      </div>
    </div>
  );
}

// ── SCHEMATIC CONTROL PANEL (right side) ─────────────────────────────────
function SchematicControlPanel({ s, set, L, lang = 'ko', isKorea, sections = ['control', 'status', 'accessories'], layout = 'vertical', statusLayout = 'vertical', compact = false }) {
  const compRun = s.compressorOn;
  const T_disc  = compRun ? `${(s.outdoorTemp + 30).toFixed(0)}°C` : '—';
  const T_cond  = compRun ? `${(s.outdoorTemp + 14).toFixed(0)}°C` : '—';
  const T_evap  = compRun ? `${(s.indoorTemp  -  8).toFixed(1)}°C` : '—';
  const P_hi    = compRun ? `${(s.outdoorTemp / 10 + 3.1).toFixed(1)} MPa` : '—';
  const P_lo    = compRun ? `${(s.indoorTemp / 25  + 0.58).toFixed(2)} MPa` : '—';
  const exvPct  = compRun ? `${(s.exvOpenPct ?? 35).toFixed(0)}%` : '—';
  const sh      = compRun ? `${(s.superheat ?? 5.5).toFixed(1)}°C` : '—';
  const sc      = compRun ? `${(s.subcooling ?? 3.0).toFixed(1)}°C` : '—';

  const ko = lang === 'ko';
  const lbl = {
    ctrlTitle:   ko ? '운전 제어'    : 'Operation Control',
    ctrlSub:     ko ? 'Operation Control' : 'Mode · Setpoint · Fan',
    mode:        ko ? '모드'         : 'Mode',
    setpoint:    ko ? '설정 온도'    : 'Setpoint',
    fanSpeed:    ko ? '팬 속도'      : 'Fan Speed',
    outdoorTitle:ko ? '실외기 상태'  : 'Outdoor Unit',
    outdoorSub:  ko ? 'Outdoor Unit — live' : 'Live Status',
    comp:        ko ? '압축기'       : 'Compressor',
    cond:        ko ? '응축기'       : 'Condenser',
    disc:        ko ? '토출 온도'    : 'Discharge T.',
    suct:        ko ? '흡입 온도'    : 'Suction T.',
    loPres:      ko ? '저압'         : 'Low Press.',
    exv:         ko ? 'EXV 개도'     : 'EXV Opening',
    superheat:   ko ? '과열도'       : 'Superheat',
    subcool:     ko ? '과냉각도'     : 'Subcooling',
    evap:        ko ? '증발 온도'    : 'Evap. Temp.',
    accTitle:    ko ? '부속 장치'    : 'Accessories',
    accSub:      'Accessories Control',
    rhTarget:    ko ? `RH 목표 ${s.targetRH}%`   : `RH Target ${s.targetRH}%`,
    co2Limit:    ko ? `CO₂ 한계 ${s.targetCO2} ppm` : `CO₂ Limit ${s.targetCO2} ppm`,
    vent:        ko ? '환기'         : 'Ventilation',
  };

  const SecHead = ({ title, sub, color }) => (
    <div style={{ borderLeft: `4px solid ${color}`, paddingLeft: 10, marginBottom: 12 }}>
      <div style={{ fontSize: 11, fontWeight: 800, color, letterSpacing: '.06em', textTransform: 'uppercase' }}>{title}</div>
      <div style={{ fontSize: 10, color: 'var(--ink-4)' }}>{sub}</div>
    </div>
  );

  const LiveRow = ({ label, value, color, mono = true }) => (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                  padding: '5px 0', borderBottom: '1px solid var(--line-soft)' }}>
      <span style={{ fontSize: 11, color: 'var(--ink-3)', fontWeight: 600 }}>{label}</span>
      <span style={{ fontFamily: mono ? 'JetBrains Mono' : 'inherit', fontWeight: 700,
                     fontSize: 13, color: color || 'var(--ink)' }}>{value}</span>
    </div>
  );

  const FanBtn = ({ lv }) => (
    <button onClick={() => set({ fanSpeed: lv })}
            style={{
              flex: 1, height: 32, borderRadius: 7, fontWeight: 700, fontSize: 11,
              fontFamily: 'JetBrains Mono',
              background: lv <= s.fanSpeed && s.fanSpeed > 0 ? '#F6EDC8' : '#F1F4F8',
              border: '1px solid ' + (s.fanSpeed === lv ? '#D6BB55' : 'var(--line)'),
              color: lv <= s.fanSpeed && s.fanSpeed > 0 ? '#9C7B14' : 'var(--ink-4)',
              boxShadow: s.fanSpeed === lv ? `0 0 0 2px #D6BB5540` : 'none',
            }}>{lv}</button>
  );

  const accessoriesHorizontal = sections.length === 1 && sections[0] === 'accessories' && layout === 'horizontal';
  const statusHorizontal = sections.includes('status') && statusLayout === 'horizontal';

  return (
    <div style={{ display: 'grid', gap: 6, alignContent: 'start', overflow: 'auto', height: '100%' }}>

      {sections.includes('control') && (

        <SecHead title={lbl.ctrlTitle} sub={lbl.ctrlSub} color="#6B5BD2" />

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 4 }}>
            {['cool','heat','auto','dry','fan','off'].filter(m => !(!isKorea && m === 'heat')).map(m => {
              const col = { cool:'#2A6FDB', heat:'#D97757', auto:'#1F8A5B', dry:'#6B5BD2', fan:'#9C7B14', off:'#8A93A4' }[m];
              const active = s.mode === m;
              return (
                <button key={m} onClick={() => set({ mode: m })}
                        style={{
                          height: 29, borderRadius: 8, fontSize: 10, fontWeight: 700,
                          background: active ? col + '18' : '#F7F9FB',
                          border: `1.5px solid ${active ? col : 'var(--line)'}`,
                          color: active ? col : 'var(--ink-3)',

            })}
          </div>
        </div>

        {/* Setpoint */}

          <div style={{ fontSize: 10.5, color: 'var(--ink-4)', fontWeight: 600, letterSpacing: '.04em', marginBottom: 6, textTransform: 'uppercase' }}>{lbl.setpoint}</div>
          <div style={{ display: 'grid', gridTemplateColumns: '36px 1fr 36px', gap: 8, alignItems: 'center' }}>
            <button className="btn" style={{ height: 32, padding: 0, justifyContent: 'center', borderRadius: 9 }}
                    onClick={() => set({ targetTemp: Math.max(16, s.targetTemp - 1) })}>
              <Icon name="minus" size={16} />

            <div style={{ textAlign: 'center' }}>

            </div>
            <button className="btn" style={{ height: 32, padding: 0, justifyContent: 'center', borderRadius: 9 }}
                    onClick={() => set({ targetTemp: Math.min(30, s.targetTemp + 1) })}>
              <Icon name="plus" size={16} />
            </button>
          </div>
        </div>

        {/* Fan speed */}
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
            <div style={{ fontSize: 10.5, color: 'var(--ink-4)', fontWeight: 600, letterSpacing: '.04em', textTransform: 'uppercase' }}>{lbl.fanSpeed}</div>
            <div style={{ fontFamily: 'JetBrains Mono', fontWeight: 700, fontSize: 13, color: '#9C7B14' }}>
              L{s.fanSpeed} · {(s.fanSpeed * 280).toFixed(0)} CMM

          </div>

        </div>
      </div>

      {sections.includes('status') && (
      <div className="card" style={{ padding: compact ? '8px 8px 7px' : '9px 9px 8px' }}>
        <SecHead title={lbl.outdoorTitle} sub={lbl.outdoorSub} color="#D97757" />

        <div style={{ display: 'grid', gridTemplateColumns: statusHorizontal ? '1fr 1fr' : '1fr 1fr', gap: 8, marginBottom: 8 }}>
          <div style={{
            background: compRun ? '#EBF4FF' : '#F7F9FB',
            borderRadius: 10, padding: statusHorizontal ? '8px 9px' : '10px 12px',
            border: `1.5px solid ${compRun ? '#2A6FDB40' : 'var(--line-soft)'}`,
          }}>
            <div style={{ fontSize: 9.5, color: 'var(--ink-4)', fontWeight: 700, letterSpacing: '.05em', textTransform: 'uppercase', marginBottom: 4 }}>{lbl.comp}</div>
            <div style={{ fontFamily: 'JetBrains Mono', fontWeight: 800, fontSize: 19, color: compRun ? '#2A6FDB' : '#B8C0CC', lineHeight: 1 }}>

            </div>
            <div style={{ fontFamily: 'JetBrains Mono', fontSize: 10, color: 'var(--ink-4)', marginTop: 3 }}>{s.powerKW.toFixed(2)} kW</div>
          </div>
          <div style={{
            background: compRun ? '#FFF5F0' : '#F7F9FB',
            borderRadius: 10, padding: statusHorizontal ? '8px 9px' : '10px 12px',
            border: `1.5px solid ${compRun ? '#D9775740' : 'var(--line-soft)'}`,

            <div style={{ fontSize: 9.5, color: 'var(--ink-4)', fontWeight: 700, letterSpacing: '.05em', textTransform: 'uppercase', marginBottom: 4 }}>{lbl.cond}</div>

              {T_cond}

            <div style={{ fontFamily: 'JetBrains Mono', fontSize: 10, color: 'var(--ink-4)', marginTop: 3 }}>{P_hi} ↑</div>
          </div>
        </div>

        {statusHorizontal ? (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', columnGap: 10 }}>
            <div>
              <LiveRow label={lbl.disc}     value={T_disc} color={compRun ? '#D97757' : 'var(--ink-4)'} />
              <LiveRow label={lbl.suct}     value={compRun ? `${(s.indoorTemp - 5).toFixed(1)}°C` : '—'} color={compRun ? '#2A6FDB' : 'var(--ink-4)'} />
              <LiveRow label={lbl.loPres}   value={P_lo}   color={compRun ? '#2A6FDB' : 'var(--ink-4)'} />

            <div>
              <LiveRow label={lbl.exv}      value={exvPct} color={compRun ? '#9C7B14' : 'var(--ink-4)'} />
              <LiveRow label={lbl.superheat} value={sh}    color={compRun ? '#6B5BD2' : 'var(--ink-4)'} />
              <LiveRow label={lbl.subcool}  value={sc}     color={compRun ? '#6B5BD2' : 'var(--ink-4)'} />
              <LiveRow label={lbl.evap}     value={T_evap} color={compRun ? '#2A6FDB' : 'var(--ink-4)'} />
            </div>
          </div>
        ) : (
          <>
            <LiveRow label={lbl.disc}      value={T_disc} color={compRun ? '#D97757' : 'var(--ink-4)'} />
            <LiveRow label={lbl.suct}      value={compRun ? `${(s.indoorTemp - 5).toFixed(1)}°C` : '—'} color={compRun ? '#2A6FDB' : 'var(--ink-4)'} />
            <LiveRow label={lbl.loPres}    value={P_lo}   color={compRun ? '#2A6FDB' : 'var(--ink-4)'} />
            <LiveRow label={lbl.exv}       value={exvPct} color={compRun ? '#9C7B14' : 'var(--ink-4)'} />
            <LiveRow label={lbl.superheat} value={sh}     color={compRun ? '#6B5BD2' : 'var(--ink-4)'} />
            <LiveRow label={lbl.subcool}   value={sc}     color={compRun ? '#6B5BD2' : 'var(--ink-4)'} />
            <LiveRow label={lbl.evap}      value={T_evap} color={compRun ? '#2A6FDB' : 'var(--ink-4)'} />

      <div className="card" style={{ padding: accessoriesHorizontal ? (compact ? '6px 8px' : '8px 10px') : (compact ? '8px 8px 7px' : '9px 9px 8px') }}>

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: compact ? 22 : 24, height: compact ? 22 : 24, borderRadius: 7,
                                background: s.ventilationOn && s.power ? '#FBE3D5' : '#F1F4F8',
                                color: s.ventilationOn && s.power ? '#D97757' : 'var(--ink-4)',

                                background: s.humidifierOn && s.power ? '#DCF1E6' : '#F1F4F8',
                                color: s.humidifierOn && s.power ? '#1F8A5B' : 'var(--ink-4)',
                                display: 'grid', placeItems: 'center' }}>
                    <Icon name="drop" size={compact ? 12 : 14} />
                  </div>
                  <span style={{ fontSize: compact ? 10.5 : 12, fontWeight: 700, color: s.humidifierOn && s.power ? '#1F8A5B' : 'var(--ink-3)' }}>

                  </span>
                </div>
                <Toggle on={s.humidifierOn} onChange={v => set({ humidifierOn: v })} />

              {s.humidifierOn && s.power && (

                <Toggle on={s.airPurifierOn} onChange={v => set({ airPurifierOn: v })} />

            {/* Ventilation */}
            <div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: s.ventilationOn ? (compact ? 4 : 6) : 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: compact ? 22 : 26, height: compact ? 22 : 26, borderRadius: 7,
                                background: s.ventilationOn && s.power ? '#FBE3D5' : '#F1F4F8',
                                color: s.ventilationOn && s.power ? '#D97757' : 'var(--ink-4)',
                                display: 'grid', placeItems: 'center' }}>
                    <Icon name="fan" size={compact ? 12 : 14} />
                  </div>
                  <span style={{ fontSize: compact ? 10.5 : 12, fontWeight: 700, color: s.ventilationOn && s.power ? '#D97757' : 'var(--ink-3)' }}>
                    {lbl.vent} · {Math.round(s.co2)} ppm
                  </span>
                </div>
                <Toggle on={s.ventilationOn} onChange={v => set({ ventilationOn: v })} />
              </div>
              {s.ventilationOn && s.power && (
                <SliderRow label={lbl.co2Limit} unit="ppm" min={600} max={1500} step={50}
                           value={s.targetCO2} onChange={v => set({ targetCO2: v })} />
              )}
            </div>
          </>
        )}
      </div>
      )}
    </div>
  );
}

// ── SCHEMATIC SVG ─────────────────────────────────────────────────────────
function SchematicSVG({ s, isKorea, flow, heat, L, onPick }) {
  const compRun  = s.compressorOn;
  const fanSpd   = s.fanSpeed;
  const heating  = isKorea && heat;
  const exvOpen  = (s.exvOpenPct  ?? 35).toFixed(0);
  const sh       = (s.superheat   ?? 5.5).toFixed(1);
  const sc       = (s.subcooling  ?? 3.0).toFixed(1);

  const T_evap = compRun ? `${(s.indoorTemp  - 8).toFixed(1)}°C`  : '—';
  const T_cond = compRun ? `${(s.outdoorTemp + 14).toFixed(0)}°C` : '—';
  const T_disc = compRun ? `${(s.outdoorTemp + 30).toFixed(0)}°C` : '—';
  const P_hi   = compRun ? `${(s.outdoorTemp / 10 + 3.1).toFixed(1)}` : '—';
  const P_lo   = compRun ? `${(s.indoorTemp / 25 + 0.58).toFixed(2)}` : '—';

  const fanAnim  = fanSpd > 0 ? `fanSpin ${Math.max(0.4, 1.8 - fanSpd / 5 * 1.3)}s linear infinite` : 'none';
  const condAnim = compRun ? 'fanSpin 0.9s linear infinite' : 'none';
  const pc = color => `pipe ${color}${flow ? ' run' : ''}`;

  // ── helpers ──
  const Hit = ({ comp, x, y, w, h }) => (
    <g style={{ cursor: 'pointer' }} onClick={() => onPick && onPick(comp)}>
      <rect x={x} y={y} width={w} height={h} fill="transparent" />
    </g>
  );

  // Measurement point pin (numbered circle)
  const Pin = ({ x, y, n }) => (
    <g>
      <circle cx={x} cy={y} r={11} fill="#0F2D55" />
      <text x={x} y={y + 4} textAnchor="middle" fontSize={9} fill="#fff" fontWeight={700}>{n}</text>
    </g>
  );

  // Text with white background pill — key fix for text overlaps
  const Tag = ({ x, y, text, bg = '#fff', color = 'var(--ink-3)', mono = false, bold = false, size = 9.5 }) => {
    const ew = text.length * (mono ? 6.8 : 6.4) + 8;
    return (
      <g>
        <rect x={x - ew / 2} y={y - 10} width={ew} height={14} rx={3} fill={bg} opacity={0.92} />
        <text x={x} y={y} textAnchor="middle" fontSize={size} fill={color}
              fontFamily={mono ? 'JetBrains Mono' : 'inherit'}
              fontWeight={bold ? 700 : 400}>{text}</text>
      </g>
    );
  };

  // Fin-tube coil — fin sheets + tube cross-section circles
  const Coil = ({ x, y, w, h, active, cols = 7, rows = 3 }) => {
    const cw = (w - 10) / cols, ch = (h - 10) / rows;
    const ac  = active ? '#2A6FDB' : '#B8C0CC';
    const bg  = active ? '#E5F0FF' : '#F7F9FB';
    const tc  = active ? '#1B55B0' : '#8A93A4'; // tube fill
    return (
      <g>
        <rect x={x} y={y} width={w} height={h} rx={5} fill={bg} stroke={ac} strokeWidth={1.5} />
        {/* fin sheets — vertical lines */}
        {Array.from({ length: cols + 1 }, (_, i) => (
          <line key={`v${i}`} x1={x + 5 + i * cw} y1={y + 4} x2={x + 5 + i * cw} y2={y + h - 4}
                stroke={ac} strokeWidth={0.8} opacity={0.35} />
        ))}
        {/* tube cross-sections — circles at each grid intersection */}
        {Array.from({ length: rows }, (_, j) =>
          Array.from({ length: cols }, (_, i) => {
            const cx = x + 5 + (i + 0.5) * cw, cy = y + 5 + (j + 0.5) * ch;
            return (
              <g key={`t${j}-${i}`}>
                <circle cx={cx} cy={cy} r={Math.min(cw, ch) * 0.32} fill="#fff" stroke={ac} strokeWidth={1.2} />
                <circle cx={cx} cy={cy} r={Math.min(cw, ch) * 0.16} fill={tc} />
              </g>
            );
          })
        )}
      </g>
    );
  };

  // Axial fan — 4 swept blades with highlight + central hub
  const FanBlade = ({ r, color = '#7A8FAD' }) => {
    const hi = color === '#9AAAC0' ? '#B8C8D8' : '#8ABAEE';
    return (
      <g>
        {[0, 90, 180, 270].map(a => (
          <g key={a} transform={`rotate(${a})`}>
            <path d={`M0,${-r * 0.14} Q${r * 0.28},${-r * 0.45} ${r * 0.12},${-r * 0.88} Q${-r * 0.18},${-r * 0.72} ${-r * 0.08},${-r * 0.3} Z`}
                  fill={color} opacity={0.92} />
            <path d={`M${r * 0.04},${-r * 0.22} Q${r * 0.16},${-r * 0.44} ${r * 0.1},${-r * 0.72}`}
                  stroke={hi} strokeWidth={1.2} fill="none" opacity={0.7} strokeLinecap="round" />
          </g>
        ))}
        <circle r={r * 0.16} fill="#6B7A90" />
        <circle r={r * 0.08} fill="#3D4A58" />

  return (
    <svg className="schem-svg" viewBox="-28 -24 980 548" preserveAspectRatio="xMidYMin meet">

        @keyframes flowDash { to { stroke-dashoffset: -24; } }

        .schem-svg .pipe.hot  { stroke:#D97757; }
        .schem-svg .pipe.cold { stroke:#2A6FDB; }
        .schem-svg .pipe-glow { fill:none; stroke-linecap:round; stroke-linejoin:round; }
        .schem-svg .pipe-glow.hot  { stroke:#D97757; stroke-width:12; opacity:.18; }
        .schem-svg .pipe-glow.cold { stroke:#2A6FDB; stroke-width:12; opacity:.18; }
        .schem-svg .pipe.run  { stroke-dasharray:14 7; animation:flowDash 0.7s linear infinite; }
        .schem-svg .pipe.hot.run  { stroke-dasharray:14 7; animation:flowDash 0.7s linear infinite; }
        .schem-svg .pipe.cold.run { stroke-dasharray:14 7; animation:flowDash 1.1s linear infinite reverse; }
      `}</style>

      {/* ─── OUTDOOR UNIT ─────────────────────────────────────────── */}
      <rect className="node-bg" x="6" y="6" width="218" height="448" rx="12" />
      <rect className="node-bg" x="442" y="6" width="458" height="448" rx="12" />

      {/* ─── REFRIGERANT PIPES — drawn first so component graphics & Tags render on top ─── */}
      {/* glow shadows */}
      <path className="pipe-glow hot"
            d={isKorea ? 'M 58,306 L 58,18 L 488,18 L 488,70'
                       : 'M 58,306 L 58,18 L 704,18 L 704,70'} />
      <path className={`pipe-glow ${heating ? 'hot' : 'cold'}`}
            d="M 170,364 L 170,442 L 704,442 L 704,122" />
      <path className="pipe-glow cold"
            d="M 442,122 L 310,122 L 310,395 L 96,395 L 96,378" />
      {/* actual pipe lines */}
      <path className={pc('hot')}
            d={isKorea ? 'M 58,306 L 58,18 L 488,18 L 488,70'
                       : 'M 58,306 L 58,18 L 704,18 L 704,70'} />
      <path className={pc(heating ? 'hot' : 'cold')}
            d="M 170,364 L 170,442 L 704,442 L 704,122" />
      <path className={pc('cold')}
            d="M 442,122 L 310,122 L 310,395 L 96,395 L 96,378"

      {/* Header — y=30 clears the hot-gas pipe glow at y=18 */}

// ── MODE CONTROL ─────────────────────────────────────────────────────────
function ModeScreen({ s, set, L }) {
  const isKorea = s.version === 'korea';
  const modes = [
    { id: 'auto', name: L('mode_auto'), desc: 'AI selects best mode',  icon: 'ai',    tone: 'auto', disabled: false },
    { id: 'cool', name: L('mode_cool'), desc: 'Refrigerant cycle',     icon: 'snow',  tone: 'cool', disabled: false },
    { id: 'heat', name: L('mode_heat'), desc: 'Heat pump + PTC',       icon: 'sun',   tone: 'heat', disabled: !isKorea },
    { id: 'dry',  name: L('mode_dry'),  desc: 'Dehumidify only',       icon: 'drop',  tone: 'dry',  disabled: false },
    { id: 'fan',  name: L('mode_fan'),  desc: 'Air circulation',       icon: 'fan',   tone: 'fan',  disabled: false },
    { id: 'off',  name: L('mode_off'),  desc: 'System on standby',     icon: 'pause', tone: 'off',  disabled: false },
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1.55fr 1fr', gap: 12, height: '100%' }}>
      <div style={{ display: 'grid', gridTemplateRows: 'auto auto 1fr', gap: 12 }}>
        <div className="card">
          <div className="card-h"><div className="title">Operation Mode</div></div>
          <div className="mode-grid" style={{ gridTemplateColumns: 'repeat(6, 1fr)' }}>
            {modes.map(m => (
              <button key={m.id}
                      className={`mode-tile ${s.mode === m.id ? 'active ' + m.tone : ''} ${m.disabled ? 'disabled' : ''}`}

                      disabled={m.disabled}>
                <div className="ico"><Icon name={m.icon} size={20} /></div>
                <div className="name">{m.name}</div>
                <div className="desc">{m.desc}</div>

          <SubSystemCard title={L('c_purif')}  icon="purifier" on={s.airPurifierOn} onToggle={v => set({ airPurifierOn: v })} detail={`PM2.5 ${s.pm25.toFixed(0)} µg/m³`} accent="#6B5BD2" />
          <SubSystemCard title="Ventilation"   icon="fan"      on={s.ventilationOn} onToggle={v => set({ ventilationOn: v })} detail={`CO₂ ${Math.round(s.co2)} ppm`} accent="#D97757" />

// ── LIVE RESPONSE PANEL ───────────────────────────────────────────────────
function LiveResponsePanel({ s, L }) {
  const mode = s.mode;
  const modeColor = { cool:'#2A6FDB', heat:'#D97757', auto:'#1F8A5B', dry:'#6B5BD2', fan:'#9C7B14', off:'#8A93A4' }[mode] || '#8A93A4';
  const Δ = s.indoorTemp - s.targetTemp;
  const reaching = Math.max(0, Math.min(100, 100 - Math.abs(Δ) * 12));
  const statusText = !s.power ? 'System Off'
    : mode === 'off'  ? 'Standby — Compressor Idle'
    : mode === 'cool' ? `Cooling  ·  Δ ${Δ >= 0 ? '+' : ''}${Δ.toFixed(1)}°C  →  ${s.targetTemp}°C`
    : mode === 'heat' ? `Heating  ·  Δ ${Δ >= 0 ? '+' : ''}${Δ.toFixed(1)}°C  →  ${s.targetTemp}°C`
    : mode === 'auto' ? `Auto  ·  ${Δ > 0.5 ? 'Cooling' : Δ < -0.5 ? 'Heating' : 'Holding'}  →  ${s.targetTemp}°C`
    : mode === 'dry'  ? `Dehumidifying  ·  RH ${s.indoorRH.toFixed(1)}%  →  ${s.targetRH}%`
    : `Circulating  ·  L${s.fanSpeed}  ·  ${(s.fanSpeed * 280).toFixed(0)} CMM`;
  const off = !s.power;
  const sensors = [
    { key: 'indoorTemp', label: L('m_indoorTemp'), value: off ? '—' : s.indoorTemp.toFixed(1), unit: '°C',  color: '#2A6FDB', hist: off ? [] : s.hist.indoorTemp },
    { key: 'indoorRH',   label: L('m_indoorRH'),   value: off ? '—' : s.indoorRH.toFixed(1),   unit: '%',   color: '#1F8A5B', hist: off ? [] : s.hist.indoorRH },
    { key: 'co2',        label: L('m_co2'),         value: off ? '—' : String(Math.round(s.co2)), unit: 'ppm', color: '#D97757', hist: off ? [] : s.hist.co2 },
    { key: 'powerKW',    label: L('m_power'),       value: off ? '—' : s.powerKW.toFixed(2),    unit: 'kW',  color: '#6B5BD2', hist: off ? [] : s.hist.powerKW },
    { key: 'eer',        label: L('m_eer'),         value: off ? '—' : s.eer.toFixed(2),        unit: '',    color: '#9C7B14', hist: off ? [] : s.hist.eer },
  ];
  return (
    <div style={{ display: 'grid', gridTemplateRows: 'auto 1fr auto', gap: 10, height: '100%' }}>
      <div className="card" style={{ background: modeColor + '10', border: `1.5px solid ${modeColor}30`, padding: '12px 14px' }}>
        <div style={{ fontSize: 10, color: modeColor, fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', marginBottom: 6 }}>▶ System Response</div>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: 'var(--ink)', lineHeight: 1.45, fontFamily: 'JetBrains Mono' }}>{statusText}</div>
        <div style={{ marginTop: 10 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--ink-4)', marginBottom: 4 }}>
            <span>Now: {s.indoorTemp.toFixed(1)}°C</span><span>Target: {s.targetTemp}°C</span>
          </div>
          <div style={{ height: 5, background: '#E7EBF0', borderRadius: 999, overflow: 'hidden' }}>
            <div style={{ height: '100%', borderRadius: 999, transition: 'width 0.7s ease', background: reaching > 80 ? '#1F8A5B' : modeColor, width: `${reaching}%` }} />
          </div>
          <div style={{ textAlign: 'right', fontSize: 9.5, color: 'var(--ink-4)', marginTop: 3, fontFamily: 'JetBrains Mono' }}>{reaching.toFixed(0)}% at target</div>
        </div>
      </div>
      <div className="card" style={{ display: 'grid', gridTemplateRows: 'auto 1fr', minHeight: 0, padding: '12px 14px' }}>
        <div className="card-h" style={{ marginBottom: 8 }}>
          <div className="title">Live Response</div>
          <span style={{ fontSize: 9, color: 'var(--ink-4)', fontFamily: 'JetBrains Mono', background: '#F1F4F8', padding: '2px 7px', borderRadius: 6 }}>1 s</span>
        </div>
        <div style={{ display: 'grid', gap: 10, alignContent: 'start', overflow: 'hidden' }}>
          {sensors.map(sen => (
            <div key={sen.key} style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 10, alignItems: 'center', paddingBottom: 8, borderBottom: '1px solid var(--line-soft)' }}>
              <div>
                <div style={{ fontSize: 10, color: 'var(--ink-4)', fontWeight: 600, marginBottom: 3 }}>{sen.label}</div>
                <Spark data={(sen.hist || []).slice(-60)} color={sen.color} height={22} padY={3} />
              </div>
              <div style={{ textAlign: 'right', minWidth: 62 }}>
                <span style={{ fontFamily: 'JetBrains Mono', fontWeight: 700, fontSize: 17, color: sen.color }}>{sen.value}</span>
                {sen.unit && <span style={{ fontSize: 10, color: 'var(--ink-3)', marginLeft: 2 }}>{sen.unit}</span>}
              </div>
            </div>
          ))}
        </div>
      </div>
      <div className="card" style={{ display: 'grid', gridTemplateColumns: '1fr auto', alignItems: 'center', gap: 12 }}>
        <div>
          <div style={{ fontSize: 10, color: 'var(--ink-4)', fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', marginBottom: 4 }}>{L('c_compressor')}</div>
          <div style={{ fontFamily: 'JetBrains Mono', fontWeight: 700, fontSize: 22, color: s.compressorOn ? '#2A6FDB' : 'var(--ink-4)' }}>
            {s.compFreqHz.toFixed(0)}<span style={{ fontSize: 11, color: 'var(--ink-4)', fontWeight: 400, marginLeft: 3 }}>Hz</span>
          </div>
          <div style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 4, fontFamily: 'JetBrains Mono', display: 'grid', gap: 1 }}>
            <span>EXV {s.compressorOn ? (s.exvOpenPct ?? 35).toFixed(0) : '—'}%</span>
            <span>SH {s.compressorOn ? (s.superheat ?? 5.5).toFixed(1) : '—'}°C · SC {s.compressorOn ? (s.subcooling ?? 3).toFixed(1) : '—'}°C</span>
          </div>
        </div>
        <Donut value={s.compFreqHz} max={110} color={s.compressorOn ? '#2A6FDB' : '#B8C0CC'} label={s.compFreqHz.toFixed(0)} sub="Hz" size={78} />
      </div>
    </div>
  );
}

function BigSetter({ value, unit, min, max, step, onChange, color = '#2A6FDB' }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '46px 1fr 46px', gap: 12, alignItems: 'center' }}>
      <button className="btn lg" style={{ height: 46, width: 46, padding: 0, justifyContent: 'center', borderRadius: 12 }} onClick={() => onChange(Math.max(min, value - step))}><Icon name="minus" size={18} /></button>
      <div style={{ textAlign: 'center' }}>
        <div style={{ fontFamily: 'JetBrains Mono', fontWeight: 600, fontSize: 56, lineHeight: 1, color, letterSpacing: '-.04em' }}>
          {value}<span style={{ fontSize: 22, marginLeft: 4, color: 'var(--ink-3)' }}>{unit}</span>
        </div>
        <input type="range" className="slider" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} style={{ marginTop: 10 }} />
      </div>
      <button className="btn lg" style={{ height: 46, width: 46, padding: 0, justifyContent: 'center', borderRadius: 12 }} onClick={() => onChange(Math.min(max, value + step))}><Icon name="plus" size={18} /></button>
    </div>
  );
}

function FanSetter({ value, onChange }) {
  return (
    <div>
      <div style={{ fontFamily: 'JetBrains Mono', fontSize: 56, fontWeight: 600, color: '#9C7B14', textAlign: 'center', lineHeight: 1, letterSpacing: '-.04em' }}>L{value}</div>
      <div style={{ display: 'flex', gap: 4, marginTop: 18 }}>
        {[0,1,2,3,4,5].map(lv => (
          <button key={lv} onClick={() => onChange(lv)} style={{
            flex: 1, height: 36, borderRadius: 8,
            background: lv <= value ? 'linear-gradient(180deg,#F6EDC8,#E9D88A)' : '#F1F4F8',
            border: '1px solid ' + (lv <= value ? '#D6BB55' : 'var(--line)'),
            color: lv <= value ? '#9C7B14' : 'var(--ink-3)',
            fontWeight: 700, fontSize: 12, fontFamily: 'JetBrains Mono'
          }}>{lv}</button>
        ))}
      </div>
    </div>
  );
}

function SubSystemCard({ title, icon, on, onToggle, detail, accent }) {
  return (
    <div className="card" style={{ display: 'grid', gridTemplateColumns: '44px 1fr auto', alignItems: 'center', gap: 12 }}>
      <div style={{ width: 44, height: 44, borderRadius: 10, background: on ? accent + '22' : '#F1F4F8', color: on ? accent : 'var(--ink-3)', display: 'grid', placeItems: 'center' }}>
        <Icon name={icon} size={20} />
      </div>
      <div>
        <div style={{ fontWeight: 700, fontSize: 14 }}>{title}</div>
        <div style={{ fontSize: 11, color: 'var(--ink-4)', marginTop: 2 }}>{detail}</div>
      </div>
      <Toggle on={on} onChange={onToggle} />
    </div>
  );
}

Object.assign(window, { DashboardScreen, SchematicScreen, ModeScreen });

  <script type="text/babel">
// Screens part 2: AI Analysis, Energy Analysis, Data Trend

// ── AI ANALYSIS ─────────────────────────────────────────────────────────
function AIScreen({ s, set, L }) {
  // health score derived from system state
  const healthScore = Math.round(
    100
    - Math.max(0, (s.co2 - s.targetCO2) / 30)
    - Math.max(0, (Math.abs(s.indoorTemp - s.targetTemp) - 1) * 8)
    - Math.max(0, (s.pm25 - 35) * 0.3)
    - Math.max(0, (s.compFreqHz - 95) * 0.4)
  );
  const score = Math.max(40, Math.min(100, healthScore));
  const scoreColor = score > 85 ? '#1F8A5B' : score > 70 ? '#D97757' : '#C0364E';
  const status = score > 85 ? 'Optimal' : score > 70 ? 'Acceptable' : 'Suboptimal';

  // diagnostics rows
  const diag = [
    { k: 'Compressor frequency', v: `${s.compFreqHz.toFixed(0)} Hz`, ok: s.compFreqHz < 100 },
    { k: 'Indoor Δ from setpoint', v: `${(s.indoorTemp - s.targetTemp).toFixed(1)} °C`, ok: Math.abs(s.indoorTemp - s.targetTemp) < 1.5 },
    { k: 'CO₂ vs limit', v: `${Math.round(s.co2)}/${s.targetCO2} ppm`, ok: s.co2 < s.targetCO2 },
    { k: 'PM2.5', v: `${s.pm25.toFixed(0)} µg/m³`, ok: s.pm25 < 35 },
    { k: 'Refrigerant suction T (est)', v: `${(s.indoorTemp - 8).toFixed(1)} °C`, ok: true },
    { k: 'Power draw', v: `${s.powerKW.toFixed(2)} kW`, ok: s.powerKW < 5 },
  ];

  // recommendations based on state
  const recs = [];
  if (s.outdoorTemp < 26 && s.mode === 'cool' && s.targetTemp < 26) {
    recs.push({ key: 'ai_r1' });
  }
  if (s.fanSpeed >= 4 && s.co2 < 700) {
    recs.push({ key: 'ai_r2' });
  }
  recs.push({ key: 'ai_r3' });
  if (recs.length < 2) recs.push({ key: 'ai_r3' });

  return (
    <div style={{ display: 'grid', gridTemplateRows: '138px 102px minmax(0, 1fr)', gap: 8, height: '100%', overflow: 'hidden' }}>
      {/* Health summary */}
      <div className="card" style={{ display: 'grid', gridTemplateColumns: '132px 1fr 1fr', gap: 12, alignItems: 'center', padding: 10, minHeight: 0 }}>
        <div style={{ display: 'grid', placeItems: 'center' }}>
          <Donut value={score} max={100} color={scoreColor} label={String(score)} sub={L('ai_health')} size={104} />
        </div>
        <div>
          <div style={{ fontSize: 11, color: 'var(--ink-3)', fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase' }}>
            {L('ai_health')}
          </div>
          <div style={{ fontSize: 20, fontWeight: 700, marginTop: 2, color: 'var(--ink)' }}>{status}</div>
          <div style={{ fontSize: 10.5, color: 'var(--ink-3)', marginTop: 2, lineHeight: 1.35 }}>
            {L('ai_status_normal')}.<br />
            Last full diagnostic cycle: {window.fmtClock(s.clockMin - 7)}
          </div>
        </div>
        <div style={{ display: 'grid', gap: 8 }}>
          <KPIRow label="Cycles today" value="34" delta="+8" deltaTone="up" />
          <KPIRow label="Avg EER (24h)" value={`${(s.eer * 0.95).toFixed(2)}`} delta="+0.12" deltaTone="up" />
          <KPIRow label="Predicted maintenance" value="14 days" delta={null} />
        </div>
      </div>

      {/* AI Recommendations */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 8, minHeight: 0 }}>
        {recs.slice(0, 3).map((r, i) => (
          <div key={i} className="ai-rec" style={{ paddingTop: 8, paddingBottom: 8, paddingLeft: 40 }}>
            <div className="ai-ico"><Icon name="ai" size={14} /></div>
            <div className="t" style={{ fontSize: 12 }}>{L(r.key + '_t')}</div>
            <div className="d" style={{ fontSize: 10.5, lineHeight: 1.35 }}>{L(r.key + '_d')}</div>
            <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
              <button className="btn primary sm">{L('a_apply')}</button>
              <button className="btn sm">Defer</button>
            </div>
          </div>
        ))}
      </div>

      {/* Diagnostics */}
      <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 10, minHeight: 0 }}>
        <div className="card" style={{ display: 'grid', gridTemplateRows: 'auto 1fr', minHeight: 0 }}>
          <div className="card-h">
            <div className="title">{L('l_diagnose')}</div>
            <button className="btn sm">Run full diagnostic</button>
          </div>
          <div style={{ overflow: 'auto' }}>
            <table className="table">
              <thead>
                <tr><th>Parameter</th><th style={{ textAlign: 'right' }}>Value</th><th style={{ width: 80 }}>Status</th></tr>
              </thead>
              <tbody>
                {diag.map((d, i) => (
                  <tr key={i}>
                    <td>{d.k}</td>
                    <td className="num" style={{ textAlign: 'right' }}>{d.v}</td>
                    <td>
                      <span style={{
                        display: 'inline-flex', alignItems: 'center', gap: 4,
                        fontSize: 11, fontWeight: 700, letterSpacing: '.05em',
                        color: d.ok ? '#1F8A5B' : '#B26A00'

                        <span style={{
                          width: 7, height: 7, borderRadius: '50%',

                        {d.ok ? 'OK' : 'CHECK'}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        <div className="card" style={{ display: 'grid', gridTemplateRows: 'auto 1fr', minHeight: 0 }}>
          <div className="card-h"><div className="title">Model Inferences</div></div>
          <div style={{ display: 'grid', gap: 10, alignContent: 'start', overflow: 'auto' }}>

    const base = 0.6 + Math.sin((h - 6) / 24 * Math.PI * 2) * 0.4;

    return Math.max(0.2, base * occ + (Math.random() - 0.5) * 0.15);

function HourlyBars({ hours }) {
  const max = Math.max(...hours);
  return (
    <svg viewBox="0 0 800 126" preserveAspectRatio="none" style={{ width: '100%', height: '100%' }}>
      {hours.map((v, i) => {
        const x = 32 + i * 30;
        const h = (v / max) * 84;
        const y = 108 - h;
        const isPeak = (i >= 13 && i <= 17);
        return (
          <g key={i}>
            <rect x={x} y={y} width="20" height={h} rx="3"
                  fill={isPeak ? '#D97757' : '#2A6FDB'} opacity={0.85} />
            {i % 3 === 0 && (
              <text x={x + 10} y={120} fontSize="8.5" textAnchor="middle" fill="#8A93A4" fontFamily="JetBrains Mono">
                {String(i).padStart(2, '0')}
              </text>
            )}
          </g>
        );
      })}
      <line x1="0" y1="108" x2="800" y2="108" stroke="#E7EBF0" />
    </svg>
  );
}

function WeeklyBars({ data }) {
  const max = Math.max(...data);
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  return (
    <svg viewBox="0 0 400 126" preserveAspectRatio="none" style={{ width: '100%', height: '100%' }}>
      {data.map((v, i) => {
        const w = 36;
        const x = 18 + i * 53;
        const h = (v / max) * 84;
        const y = 108 - h;
        return (
          <g key={i}>
            <rect x={x} y={y} width={w} height={h} rx="6" fill="#14B8A6" opacity="0.85" />
            <text x={x + w / 2} y={y - 3} fontSize="9" textAnchor="middle" fill="#0F1A2E" fontFamily="JetBrains Mono" fontWeight="600">{v.toFixed(0)}</text>
            <text x={x + w / 2} y={120} fontSize="9" textAnchor="middle" fill="#8A93A4">{days[i]}</text>
          </g>
        );
      })}
    </svg>
  );
}

function MiniMetric({ label, value, unit, tone = 'mint' }) {
  const tones = {
    mint: ['var(--mint)', 'var(--mint-d)'],
    sky: ['var(--sky)', 'var(--sky-d)'],

    lilac: ['var(--lilac)', 'var(--lilac-d)'],
    lemon: ['var(--lemon)', 'var(--lemon-d)'],

}
