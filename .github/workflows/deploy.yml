name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if the commit was made by the bot (prevents infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild index.html from src/
        run: python3 build.py

      - name: Commit rebuilt index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "build: rebuild index.html [skip ci]"
          git push
